[package]
name = "peermine"
version = "0.2.0"
description = "PeerMine — Túnel P2P nativo em Rust/QUIC para Minecraft LAN"
authors = ["PeerMine"]
edition = "2021"

[lib]
name = "peermine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
iroh = "1.5"
noq-proto = "1.5.0"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
